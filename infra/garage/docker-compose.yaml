# =============================================================================
# Garage — shared S3-compatible object storage (Coolify service, decision D8)
# Replaces MinIO (archived upstream). Deployed as its own Coolify resource.
#
# Services:
#   - garage: single-node Garage v2
#       * S3 API    garage:3900 on the `coolify` network (apps: S3_ENDPOINT_URL=http://garage:3900)
#                   + ${BIND_IP}:3900 on the host (unset → 127.0.0.1; Tailscale IP → tailnet only)
#       * Admin API 127.0.0.1:3903 on the host only
#       * RPC       3901, container-internal (single node)
#
# Required Coolify environment variables (generate once, never commit):
#   GARAGE_RPC_SECRET     openssl rand -hex 32
#   GARAGE_ADMIN_TOKEN    openssl rand -base64 32
#   GARAGE_METRICS_TOKEN  openssl rand -base64 32
# Optional:
#   BIND_IP               e.g. the Tailscale IP, to reach the S3 API from the tailnet
#
# Garage enforces the S3 region (MinIO does not). Clients must sign with
# s3_region = "us-east-1": set AWS_DEFAULT_REGION=us-east-1 in every client
# service (read by both botocore/s3fs and DuckDB httpfs, no code change).
#
# Buckets and access keys are created once with the CLI:
#   docker exec garage /garage bucket create <bucket>
#   docker exec garage /garage key create <key-name>
#   docker exec garage /garage bucket allow --read --write --owner <bucket> --key <key-name>
# Network: coolify (external)
# =============================================================================

services:
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?set GARAGE_METRICS_TOKEN}
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    ports:
      # Never bind to a public IP
      - "${BIND_IP:-127.0.0.1}:3900:3900"
      - "127.0.0.1:3903:3903"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - coolify
    restart: always

configs:
  garage_toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      metadata_auto_snapshot_interval = "6h"

      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [admin]
      api_bind_addr = "[::]:3903"

volumes:
  garage-meta:
  garage-data:

networks:
  coolify:
    external: true
    name: coolify
