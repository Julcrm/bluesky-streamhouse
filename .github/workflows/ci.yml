name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # Spark parsing parity test (branch A): a local SparkSession needs a JVM, the
      # same major version as the Spark image
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Compiles every model, macro and test without a database (profile env defaults).
      # Before the tests: the Dagster definitions load the manifest it writes
      - name: Parse dbt project (branch B)
        run: uv run dbt parse --project-dir dbt/duckdb --profiles-dir dbt/duckdb

      - name: Parse dbt project (branch A)
        run: uv run dbt parse --project-dir dbt/spark --profiles-dir dbt/spark

      - name: Run tests
        run: uv run pytest

      - name: Validate Dagster definitions (branch B)
        run: uv run dagster definitions validate -m src.dagster.definitions

      - name: Validate Dagster definitions (branch A)
        run: uv run dagster definitions validate -m src.dagster.spark_definitions
        env:
          DAGSTER_CODE_LOCATION: bluesky_spark

      - name: Check uv.lock is up to date
        run: uv lock --check

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The Coolify API is only reachable through Tailscale: the runner joins the
    # tailnet as an ephemeral `tag:ci` node via workload identity federation (OIDC).
    permissions:
      contents: read
      id-token: write
    env:
      # Deployment is skipped (not failed) until the Coolify resource and secrets exist
      DEPLOY_CONFIGURED: ${{ secrets.COOLIFY_WEBHOOK_URL != '' }}

    steps:
      - name: Skip notice
        if: env.DEPLOY_CONFIGURED != 'true'
        run: echo "::notice::Coolify deploy secrets not set, deployment skipped"

      - name: Join tailnet
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.125.33.49

      - name: Trigger Coolify deployment
        if: env.DEPLOY_CONFIGURED == 'true'
        run: |
          curl -f --show-error --max-time 30 -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_SECRET }}"
