# Logging of the Spark Thrift server (src/processing/spark/thrift_server.py).
# Without it, Spark's INFO defaults (one line per task, an Iceberg metrics report per scan
# and commit) filled the 3 x 10 MB of Docker logs in a few hours: the JVM crashes of
# 12-14/10 left no trace. WARN everywhere; the server's lifecycle stays at INFO. The JVM
# writes its own "Terminating due to java.lang.OutOfMemoryError" line to stderr, outside log4j
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Start, stop and signals of the server
logger.thrift.name = org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
logger.thrift.level = info
