version: 2

# Uniqueness tests only scan the last day (var recent_rows_window): Silver keeps 7 days
# and the tests run every 15 min. Duplicates can only come from recent Bronze replays.

models:
  - name: silver_posts
    description: "Post creations and edits, one row per Jetstream event (D18, D19)."
    columns:
      - name: seq
        description: "Jetstream sequence, deduplication key"
        tests:
          - not_null
          - unique:
              config:
                where: "event_time >= now() - {{ var('recent_rows_window') }}"
      - name: did
        description: "Author account"
        tests: [not_null]
      - name: operation
        description: "create or update (edits are rare, ~0.01 %)"
        tests:
          - accepted_values:
              arguments:
                values: ["create", "update"]
      - name: event_time
        description: "Jetstream reception time (UTC): the reference time of every metric"
        tests: [not_null]
      - name: created_at
        description: "Time declared by the client, may be backdated (informative only)"
      - name: langs
        description: "Declared languages (BCP-47), NULL when the client sets none"
      - name: hashtags
        description: "Distinct lowercase tags: facet tags and record tags"
      - name: bronze_snapshot_id
        description: "Bronze snapshot read up to by the run that wrote the row (D16)"
        tests: [not_null]

  - name: silver_likes
    description: "Like creations, one row per Jetstream event."
    columns:
      - name: seq
        tests:
          - not_null
          - unique:
              config:
                where: "event_time >= now() - {{ var('recent_rows_window') }}"
      - name: did
        tests: [not_null]
      - name: event_time
        tests: [not_null]
      - name: subject_uri
        description: "AT URI of the liked record"
        tests: [not_null]
      - name: subject_did
        description: "Author of the liked record"
      - name: bronze_snapshot_id
        tests: [not_null]

  - name: silver_reposts
    description: "Repost creations, one row per Jetstream event."
    columns:
      - name: seq
        tests:
          - not_null
          - unique:
              config:
                where: "event_time >= now() - {{ var('recent_rows_window') }}"
      - name: did
        tests: [not_null]
      - name: event_time
        tests: [not_null]
      - name: subject_uri
        description: "AT URI of the reposted record"
        tests: [not_null]
      - name: bronze_snapshot_id
        tests: [not_null]

  - name: silver_follows
    description: "Follow creations, one row per Jetstream event."
    columns:
      - name: seq
        tests:
          - not_null
          - unique:
              config:
                where: "event_time >= now() - {{ var('recent_rows_window') }}"
      - name: did
        description: "Follower"
        tests: [not_null]
      - name: event_time
        tests: [not_null]
      - name: subject_did
        description: "Followed account"
        tests: [not_null]
      - name: bronze_snapshot_id
        tests: [not_null]

  - name: silver_deletes
    description: "Deletions of the four collections, one row per Jetstream event (D18)."
    columns:
      - name: seq
        tests:
          - not_null
          - unique:
              config:
                where: "event_time >= now() - {{ var('recent_rows_window') }}"
      - name: did
        tests: [not_null]
      - name: collection
        tests:
          - accepted_values:
              arguments:
                values:
                  - app.bsky.feed.post
                  - app.bsky.feed.like
                  - app.bsky.feed.repost
                  - app.bsky.graph.follow
      - name: rkey
        tests: [not_null]
      - name: event_time
        tests: [not_null]
      - name: bronze_snapshot_id
        tests: [not_null]
