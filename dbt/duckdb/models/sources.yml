version: 2

sources:
  - name: bronze
    description: "Bronze layer written by the Quix Streams sink (contract in src/processing/bronze.py)"
    database: bronze
    schema: main
    tables:
      - name: bronze_events
        # Same asset as the observable source `quix_bronze` in src/dagster/assets.py
        # (prefix config.DAGSTER_ASSET_PREFIX, layer folder `bronze`)
        meta:
          dagster:
            asset_key: ["bluesky", "bronze", "quix_bronze"]
        description: >
          One row per Jetstream commit event, append-only. Duplicates from producer
          resumes or consumer replays are expected and removed in Silver on `seq`.
