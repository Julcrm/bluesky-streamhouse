version: 2

sources:
  - name: bronze
    description: "Bronze layer written by the Spark streaming job (contract in src/processing/bronze.py)"
    # bench_bronze with --target bench (controlled test, macros/bench.sql)
    schema: "{{ 'bench_' if target.name == 'bench' else '' }}bronze"
    tables:
      - name: bronze_events
        meta:
          dagster:
            asset_key: ["bluesky", "spark", "bronze", "spark_bronze"]
        description: >
          One row per Jetstream commit event, append-only (Iceberg). Duplicates from
          producer resumes are expected and removed in Silver on `seq`.
