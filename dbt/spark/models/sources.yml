version: 2

sources:
  - name: bronze
    description: "Bronze layer written by the Spark streaming job (contract in src/processing/bronze.py)"
    schema: bronze
    tables:
      - name: bronze_events
        meta:
          dagster:
            asset_key: ["bluesky", "bronze", "spark_bronze"]
        description: >
          One row per Jetstream commit event, append-only (Iceberg). Duplicates from
          producer resumes are expected and removed in Silver on `seq`.
