# =============================================================================
# Bluesky Streamhouse — local development stack (mirrors the VPS services)
# Services:
#   - redpanda:         Kafka-compatible broker (external listener 127.0.0.1:19092)
#   - redpanda-console: web UI for topics and consumer groups (localhost:8088)
#   - garage:           S3-compatible object storage, single node (localhost:3900)
#                       bucket + access key auto-created from .env on first start
#   - postgres:         DuckLake catalog, Iceberg catalog, Dagster storage (localhost:5432)
#   - lakekeeper:       Iceberg REST catalog of branch A (localhost:8181), with its
#                       one-shot migrate and init (bootstrap + warehouse on Garage)
#   - spark:            branch A streaming job (profile `spark`: make spark)
#   - iceberg-maintenance: branch A Iceberg maintenance, once (make iceberg-maintenance)
#   - spark-thrift:     branch A Spark Thrift server for dbt-spark (localhost:10000),
#                       always up locally (make spark-thrift); in prod its supervisor
#                       runs it on A's days only
#   - dbt-spark:        dbt build of branch A against spark-thrift (make dbt-spark-build)
# Usage: make up / make down / make logs
# All ports are bound to 127.0.0.1: nothing is reachable from the local network.
# Credentials come from .env (created from .env.example by `make up`), local only.
# =============================================================================

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    container_name: bsh-redpanda
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    container_name: bsh-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8088}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # Same image and config as the production Garage (Coolify resource), decision D8.
  # --default-bucket creates BUCKET and the AWS_* access key on first start.
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: bsh-garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set in .env}
      GARAGE_DEFAULT_BUCKET: ${BUCKET:-bluesky-streamhouse}
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:18.6-alpine
    container_name: bsh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamhouse}
      POSTGRES_DB: ${DUCKLAKE_CATALOG_DB:-ducklake_catalog}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Iceberg REST catalog of branch A (Postgres-backed), first migrated then initialised
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-streamhouse}:${POSTGRES_PASSWORD:-streamhouse}@postgres:5432/iceberg_catalog
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-streamhouse}:${POSTGRES_PASSWORD:-streamhouse}@postgres:5432/iceberg_catalog
      # Encrypts the storage credentials kept in the catalog database
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.6
    container_name: bsh-lakekeeper
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully

  lakekeeper-init:
    build:
      context: .
      dockerfile: docker/lakekeeper/Dockerfile
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      ICEBERG_WAREHOUSE: bluesky
      ICEBERG_KEY_PREFIX: iceberg
      BUCKET: ${BUCKET:-bluesky-streamhouse}
      # The endpoint Lakekeeper hands to its clients: containers of this network
      S3_ENDPOINT_URL: http://garage:3900
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      lakekeeper:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: "no"

  # Branch A streaming job. Runs in the network because Lakekeeper hands out
  # http://garage:3900, which the host cannot resolve
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: bsh-spark
    profiles: ["spark"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
      # Benchmark calendar (D28), read by the supervisor
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPARK_DRIVER_MEMORY: 480m
      SPARK_DRIVER_JAVA_OPTIONS: >-
        -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m
        -Xss512k -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
    volumes:
      - spark-checkpoint:/app/state
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  # Branch A Iceberg maintenance, run once on demand (make iceberg-maintenance), with
  # the image of the bluesky_spark code location; run history in the local Dagster db
  iceberg-maintenance:
    build:
      context: .
      dockerfile: docker/dagster-spark/Dockerfile
    profiles: ["spark"]
    command: ["dagster", "job", "execute", "-m", "src.dagster.spark_definitions", "-j", "bluesky_iceberg_maintenance"]
    environment:
      ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER:-streamhouse}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamhouse}
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_DB: dagster
      # Benchmark calendar (D28): completeness of A's days
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-streamhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamhouse}
      SPARK_DRIVER_JAVA_OPTIONS: >-
        -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m
        -Xss512k -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully

  # Branch A Spark Thrift server (D6 revised), image of the bluesky_spark code location.
  # Started directly, without the supervisor of prod (the local calendar rarely gives
  # the day to A). Port 10000 on 127.0.0.1: dbt can also run from the host
  spark-thrift:
    build:
      context: .
      dockerfile: docker/dagster-spark/Dockerfile
    container_name: bsh-spark-thrift
    profiles: ["spark"]
    command: [".venv/bin/python", "-m", "src.processing.spark.thrift_server"]
    environment:
      ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
      SPARK_THRIFT_DRIVER_MEMORY: 768m
      SPARK_DRIVER_JAVA_OPTIONS: >-
        -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m
        -XX:MaxMetaspaceSize=320m -Xss512k -XX:+ExitOnOutOfMemoryError
      MALLOC_ARENA_MAX: "2"
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - import socket; socket.create_connection(('localhost', 10000), 2)
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully

  # Branch A Silver/Gold with dbt-spark (make dbt-spark-build): the dbt process only, the
  # project mounted from the working copy; the queries run in spark-thrift
  dbt-spark:
    build:
      context: .
      dockerfile: docker/dagster-spark/Dockerfile
    profiles: ["spark"]
    working_dir: /tmp
    entrypoint: ["/app/.venv/bin/dbt"]
    command: ["build", "--project-dir", "/app/dbt/spark", "--profiles-dir", "/app/dbt/spark"]
    environment:
      SPARK_THRIFT_HOST: spark-thrift
    volumes:
      - ./dbt/spark:/app/dbt/spark
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      spark-thrift:
        condition: service_healthy

configs:
  garage_toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"

      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

volumes:
  redpanda-data:
  garage-meta:
  garage-data:
  postgres-data:
  spark-checkpoint:
