# =============================================================================
# Bluesky Streamhouse — Docker Compose (production, Coolify)
# Services:
#   - producer: Jetstream v2 -> Redpanda `raw_events` (no exposed port)
#   - quix: branch B, Redpanda `raw_events` -> DuckLake Bronze (no exposed port), run by
#     its supervisor on B's days only (D28, calendar in the bluesky_benchmark database)
#   - bluesky-duckdb: branch B Dagster gRPC code server, Silver/Gold dbt assets
#     (port 4000 on the coolify network only; the service name is its DNS alias)
#   - lakekeeper (+ one-shot lakekeeper-migrate, lakekeeper-init): Iceberg REST
#     catalog of branch A, database iceberg_catalog on the shared Postgres
#   - spark: branch A, Redpanda `raw_events` -> Iceberg Bronze (no exposed port)
# Shared services, deployed as separate Coolify resources:
#   - redpanda (redpanda:9092) · garage (garage:3900) · postgres
# Services of later phases (Spark, API) are added here.
# Network: coolify (external)
# =============================================================================

services:
  # Streams Bluesky commit events into Redpanda; resumes from the last seq on restart
  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: bsh-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - JETSTREAM_MAX_REPLAY_MINUTES=${JETSTREAM_MAX_REPLAY_MINUTES:-60}
    # Leaves time for the SIGTERM flush of in-flight messages
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M  # measured ~37 MiB steady, <110 MiB with a full send queue
    networks:
      - coolify
    restart: always

  # Branch B: raw_events -> DuckLake Bronze (Postgres catalog, Parquet on Garage)
  quix:
    build:
      context: .
      dockerfile: docker/quix/Dockerfile
    container_name: bsh-quix
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      # Benchmark settings (offset reset, inlining limit D15) stay in src/config.py on
      # purpose: Coolify stores every ${VAR:-default} at first deploy and keeps injecting
      # it, so a default changed here later would silently not apply
      # DuckLake catalog on the shared Postgres (decision D12)
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DUCKLAKE_CATALOG_DB=${DUCKLAKE_CATALOG_DB:-ducklake_catalog}
      # Garage, key `bluesky` (RWO on this bucket only)
      - S3_ENDPOINT_URL=http://garage:3900
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - BUCKET=${BUCKET:-bluesky-streamhouse}
    # Leaves time for the last checkpoint flush and offset commit on SIGTERM
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # Same limit as Spark (contract): Spark needs ~700-740 MiB, 768 MB did not fit.
          # Quix: ~250 MiB live, ~700 MiB in the 35 M-row catch-up of 2026-09-28
          memory: 1G
    networks:
      - coolify
    restart: always

  # Branch B Dagster code location `bluesky_duckdb` (decision D20). The shared
  # dagster-workspace reaches it at bluesky-duckdb:4000 (Coolify adds the service name
  # as network alias). Runs execute here: dbt + DuckDB memory counts against this limit
  bluesky-duckdb:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    expose:
      - "4000"
    environment:
      # Dagster storage, shared with dagster-workspace
      - DAGSTER_POSTGRES_USER=${DAGSTER_POSTGRES_USER}
      - DAGSTER_POSTGRES_PASSWORD=${DAGSTER_POSTGRES_PASSWORD}
      - DAGSTER_POSTGRES_HOST=${DAGSTER_POSTGRES_HOST}
      - DAGSTER_POSTGRES_DB=${DAGSTER_POSTGRES_DB}
      # DuckLake catalogs on the shared Postgres (decisions D12, D22)
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DUCKLAKE_CATALOG_DB=${DUCKLAKE_CATALOG_DB:-ducklake_catalog}
      # Garage, key `bluesky` (RWO on this bucket only)
      - S3_ENDPOINT_URL=http://garage:3900
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - BUCKET=${BUCKET:-bluesky-streamhouse}
      # Kafka high watermarks: the 19:00 bounds of the alternation (D28)
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      # Failure alerts by email (Resend, as velib); none are sent while unset
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ALERT_EMAIL=${ALERT_EMAIL}
    # A run in progress is interrupted on redeploy; the next schedule tick resumes
    # from the last Bronze snapshot Silver read (incremental by snapshot, D16)
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M  # DuckDB memory_limit 1 GB (dbt profile) + dagster; ~200 MiB idle
    networks:
      - coolify
    restart: always

  # --- Branch A -------------------------------------------------------------
  # Iceberg REST catalog (Lakekeeper, Rust, ~30 MiB). Its RAM and CPU are part of
  # branch A's fixed cost in the benchmark, as Postgres is for DuckLake
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["migrate"]
    environment: &lakekeeper-env
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/iceberg_catalog
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/iceberg_catalog
      # Encrypts the S3 credentials kept in the catalog database
      - LAKEKEEPER__PG_ENCRYPTION_KEY=${LAKEKEEPER_ENCRYPTION_KEY}
    networks:
      - coolify
    restart: "no"

  # No port exposed: reachable on the coolify network only. No authentication yet:
  # any container of this network could ask it to sign S3 requests on the bucket
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["serve"]
    environment: *lakekeeper-env
    expose:
      - "8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M  # ~30 MiB measured
    networks:
      - coolify
    restart: always

  # Bootstrap + Iceberg warehouse on Garage, idempotent (docker/lakekeeper/init.sh)
  lakekeeper-init:
    build:
      context: .
      dockerfile: docker/lakekeeper/Dockerfile
    environment:
      - LAKEKEEPER_URL=http://lakekeeper:8181
      - ICEBERG_WAREHOUSE=bluesky
      - ICEBERG_KEY_PREFIX=iceberg
      - BUCKET=${BUCKET:-bluesky-streamhouse}
      - S3_ENDPOINT_URL=http://garage:3900
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      lakekeeper:
        condition: service_healthy
    networks:
      - coolify
    restart: "no"

  # Spark Structured Streaming -> Iceberg Bronze. No S3 key: Lakekeeper signs
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - ICEBERG_CATALOG_URI=http://lakekeeper:8181/catalog
      # Benchmark calendar (database bluesky_benchmark, D28), read by the supervisor
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # JVM sized for the 1 GB limit (tuning checklist): Spark's minimum heap is 450 MB,
      # ~250 MB more for classes, JIT and threads; fail fast on OOM instead of hanging
      - SPARK_DRIVER_MEMORY=480m
      - SPARK_DRIVER_JAVA_OPTIONS=-XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -Xss512k -XX:+ExitOnOutOfMemoryError
      - MALLOC_ARENA_MAX=2
    # One checkpoint per benchmark day (Kafka offsets, batch ids): losing it during a
    # day restarts that day from its start offsets (duplicates in Bronze, removed in
    # Silver)
    volumes:
      - spark-checkpoint:/app/state
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    networks:
      - coolify
    restart: always

volumes:
  spark-checkpoint:

networks:
  coolify:
    external: true
    name: coolify
